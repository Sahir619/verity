[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verity"
version = "0.1.0"
description = "Verity agent backend: plain-English chip spec to verified, evolved Verilog."
readme = "ARCHITECTURE.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# cocotb is NOT a backend dependency: it lives only in the sandbox tool image (sandbox/Dockerfile).
# SSE is hand-rolled on Starlette StreamingResponse (no sse-starlette), so id:, ": ping" and
# Last-Event-ID handling stay under our control (ARCHITECTURE 9.2).
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "openai>=1.40",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "aiosqlite>=0.20",
  "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[project.scripts]
verity-api = "verity.main:main"
verity-evals = "verity.evals.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["verity*"]

[tool.setuptools.package-data]
"verity.roles" = ["prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
