# riscv-formal checks for the 2-stage rv32i_pipe2_core (NRET 1).
# An instruction retires on the cycle after it is fetched, or one cycle later when the previous
# instruction redirected. Depths are shorter than the multicycle core's 5 to 7 cycle instruction.
# The insn number is the check cycle.
# reg, pc_fwd, pc_bwd, causal and cover are start then depth.
# unique is start, trig, depth. ill is the check cycle.
# Liveness and hang are omitted, matching the multicycle pack: a killed slot is a legal bubble.

[options]
isa rv32i
nret 1
solver boolector

[depth]
insn 10
reg 1 16
pc_fwd 1 16
pc_bwd 1 16
unique 1 8 16
causal 1 16
ill 10
cover 1 16

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define YOSYS

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/dut.v

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
