# riscv-formal checks for the multicycle rv32i_core (NRET 1).
# Depths suit a 5 to 7 cycle instruction. The insn number is the check cycle.
# reg, pc_fwd, pc_bwd, causal and cover are start then depth.
# unique is start, trig, depth. ill is the check cycle.
# Liveness and hang are omitted: mem_ready may stay 0, which is the ready/valid protocol.

[options]
isa rv32i
nret 1
solver boolector

[depth]
insn 15
reg 1 20
pc_fwd 1 20
pc_bwd 1 20
unique 1 10 20
causal 1 20
ill 15
cover 1 20

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define YOSYS

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/dut.v

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
