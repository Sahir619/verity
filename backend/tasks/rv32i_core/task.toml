schema = "verity.task/1"
id = "rv32i_core"
title = "RV32I multicycle core"
summary = "a multicycle RV32I core that runs real programs against a locked model"
spec_text = "A multicycle RV32I core. It wires seven provided blocks and runs one instruction at a time through fetch, decode, execute, memory and writeback. The tests are real programs. Writes to x0 are dropped. FENCE retires as a nop. ECALL, EBREAK, illegal encodings, misaligned loads or stores, and a taken branch, JAL or JALR whose target is not a multiple of 4 retire once as a trap and then halt the core. One clock, synchronous active-low reset, and the PC starts at 0."
top = "rv32i_core"
family = "cpu"
latency_cycles = 1
max_lines = 300
test_count = 18
default_priority = "area"
priorities = ["area", "speed", "power"]
target_clock_ns = 10.0
max_plan_blocks = 8
eval_only = true
is_custom = false
coding_rules = [
  "The seven block modules are provided; instantiate each exactly once; never define or copy them.",
  "The top holds pc, ir, alu_out and mdr. Reset clears pc to 0. alu_out takes alu.y on the rising edge that ends EXEC. mdr takes mem_rdata on the rising edge in MEM when mem_ready is 1.",
  "imm.instr and dec.instr are ir. rf.ra1 is ir[19:15], rf.ra2 is ir[24:20], rf.wa is ir[11:7]. rf.we is ctl.rf_wen AND dec.rf_we. rf.wd follows wb_sel: 0 alu_out, 1 lsu.ld, 2 pc+4, 3 zero.",
  "alu.a follows a_sel: 0 is rf.rd1, 1 is pc, 2 and 3 are zero. alu.b follows b_sel: 0 is rf.rd2, 1 is imm. alu.op is dec.alu_op.",
  "br.a is rf.rd1, br.b is rf.rd2, br.funct3 is ir[14:12].",
  "lsu.addr_lo is alu.y[1:0] while the controller state is EXEC, and alu_out[1:0] in every other state. lsu.funct3 is ir[14:12], lsu.rdata is mdr, lsu.wdata is rf.rd2. ctl.misaligned is lsu.misaligned.",
  "ctl.mem_ready is the mem_ready port. ctl.is_load, is_store, is_branch, is_jal and is_jalr come from the decoder. ctl.taken comes from the branch block.",
  "ctl.trap is the decoder's trap OR target_misaligned, where target_misaligned = (is_jal OR is_jalr OR (is_branch AND br.taken)) AND alu.y[1]. In DECODE alu.y is the jump or branch target, and RV32I without compressed instructions traps when that target is not a multiple of 4.",
  "mem_addr is pc while the state is FETCH, and {alu_out[31:2], 2'b00} otherwise. mem_wdata is lsu.sdata. mem_wstrb is lsu.wstrb only when ctl.mem_we is 1, otherwise 0.",
  "In WB, when pc_we is 1, pc becomes (alu_out with bit 0 cleared) for JALR, alu_out when pc_sel is 1 for JAL or a taken branch, and pc+4 when pc_sel is 0. In FETCH, when ir_we is 1, ir becomes mem_rdata.",
  "rvfi_valid is 1 in WB, and also for one cycle when a trap is decided: DECODE with ctl.trap, or EXEC of a misaligned load or store. It is 0 in every other state, including HALT. rvfi_order counts those rvfi_valid pulses from 0 after reset.",
  "rvfi_insn is ir. rvfi_pc_rdata is pc. rvfi_pc_wdata is the next pc: alu_out with bit 0 cleared for JALR, alu_out when pc_sel is 1, and pc+4 otherwise. On the trap cycle rvfi_pc_wdata is pc.",
  "rvfi_trap and rvfi_halt are 1 only on that trap cycle. rvfi_intr is 0. rvfi_mode is 3. rvfi_ixl is 1. After the trap cycle the core is halted and rvfi_valid stays 0.",
  "rvfi_rs1_addr is ir[19:15] and rvfi_rs2_addr is ir[24:20]. rvfi_rs1_rdata is rf.rd1 and rvfi_rs2_rdata is rf.rd2. x0 reads as 0.",
  "rvfi_rd_addr is ir[11:7] when the register file writes that register, otherwise 0. rvfi_rd_wdata is the write data when rvfi_rd_addr is not 0, otherwise 0. On the trap cycle both are 0.",
  "On a load retire, rvfi_mem_addr is {alu_out[31:2], 2'b00}, rvfi_mem_rmask is the byte mask of the access size at alu_out[1:0] (1, 2 or 4 bytes; LBU and LHU use the same mask as LB and LH), rvfi_mem_rdata is mdr, and the write mask and write data are 0. On a store retire, rvfi_mem_wmask is lsu.wstrb, rvfi_mem_wdata is lsu.sdata, and the read mask and read data are 0. Every other retire, including the trap cycle, drives both masks to 0.",
  "dbg_stall is 3 when halted, 1 in FETCH while mem_ready is 0, 2 in MEM while mem_ready is 0, and 0 in every other cycle, including the trap decision cycle. halted is ctl.halted.",
  "FENCE retires and writes nothing. ECALL, EBREAK, an illegal encoding, a misaligned load or store, or a taken branch, JAL or JALR to a target that is not a multiple of 4 retires once with rvfi_trap and rvfi_halt set, rvfi_rd_addr 0 and both memory masks 0, then the core halts. It does not write a register or memory. A write to x0 is reported as rd 0 and wdata 0.",
  """
module rv32i_imm (
    input  logic [31:0] instr,
    output logic [31:0] imm
);
""",
  """
module rv32i_dec (
    input  logic [31:0] instr,
    output logic [3:0] alu_op,
    output logic [1:0] a_sel,
    output logic b_sel,
    output logic [1:0] wb_sel,
    output logic rf_we,
    output logic is_load,
    output logic is_store,
    output logic is_branch,
    output logic is_jal,
    output logic is_jalr,
    output logic trap
);
""",
  """
module rv32i_alu (
    input  logic [31:0] a,
    input  logic [31:0] b,
    input  logic [3:0] op,
    output logic [31:0] y
);
""",
  """
module rv32i_br (
    input  logic [31:0] a,
    input  logic [31:0] b,
    input  logic [2:0] funct3,
    output logic taken
);
""",
  """
module rv32i_lsu (
    input  logic [1:0] addr_lo,
    input  logic [2:0] funct3,
    input  logic [31:0] rdata,
    input  logic [31:0] wdata,
    output logic [31:0] ld,
    output logic [3:0] wstrb,
    output logic [31:0] sdata,
    output logic misaligned
);
""",
  """
module rv32i_rf (
    input  logic clk,
    input  logic rst_n,
    input  logic [4:0] ra1,
    input  logic [4:0] ra2,
    input  logic [4:0] wa,
    input  logic [31:0] wd,
    input  logic we,
    output logic [31:0] rd1,
    output logic [31:0] rd2
);
""",
  """
module rv32i_ctl (
    input  logic clk,
    input  logic rst_n,
    input  logic mem_ready,
    input  logic is_load,
    input  logic is_store,
    input  logic is_branch,
    input  logic is_jal,
    input  logic is_jalr,
    input  logic trap,
    input  logic taken,
    input  logic misaligned,
    output logic [2:0] state,
    output logic mem_valid,
    output logic mem_we,
    output logic ir_we,
    output logic rf_wen,
    output logic pc_we,
    output logic pc_sel,
    output logic halted
);
""",
]

