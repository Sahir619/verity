schema = "verity.task/1"
id = "add8"
title = "8-bit adder with carry"
summary = "an 8-bit combinational adder with carry in and carry out"
spec_text = "An 8-bit adder with carry in and carry out. sum is the low 8 bits of a + b + cin and cout is the carry out of bit 7. The design is purely combinational, with no clock and no reset."
top = "add8"
family = "adder"
element_type = "uint8"
latency_cycles = 0
max_lines = 60
test_count = 12
default_priority = "area"
priorities = ["area", "speed", "power"]
target_clock_ns = 10.0
max_plan_blocks = 4
eval_only = false
coding_rules = [
  "The design is purely combinational: no clock, no registers, no reset. sum and cout must follow a, b and cin immediately.",
]

[clock]
name = ""

[reset]
name = ""

[sim]
seed = 1
max_cycles_per_case = 8

[eqy]
enabled = true
depth = 4

[[ports]]
name = "a"
dir = "in"
width = 8

[[ports]]
name = "b"
dir = "in"
width = 8

[[ports]]
name = "cin"
dir = "in"
width = 1

[[ports]]
name = "sum"
dir = "out"
width = 8

[[ports]]
name = "cout"
dir = "out"
width = 1
